# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_BT_BAS=y

# RGB LED widget
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# ========================================
# DYA Studio modules (Peripheral side)
# ========================================
# Battery history (data collection on peripheral)
CONFIG_ZMK_BATTERY_HISTORY=y

# Settings RPC (receive settings changes from central)
CONFIG_ZMK_SETTINGS_RPC=y

# Split event relay (peripheral -> central)
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Allow 8-char (7 + null) identifiers so relay event names read as
# meaningful strings like "LAYR", "PROF", "ENDP" instead of cryptic
# 3-char abbrevs.
CONFIG_ZMK_SPLIT_RELAY_EVENT_TYPE_NAME_LEN=8

# Setting persistence
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=60000

# ========================================
# Sharp Memory LCD LS011B7DH03 (160x68 monochrome)
# ========================================
# Enables display subsystem + LVGL for the peripheral-side status LCD.
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_SPI=y

# Monochrome (1bpp). Larger VDB improves throughput on wide 160x68 refreshes.
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=49152

# Pixel fonts sized for the short 68px height.
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_UNSCII_16=y

# Enable the LVGL widgets used by the notification panel UI.
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_BAR=y


# Memory LCD holds the last frame at ~60uW; blanking on idle would only
# waste a refresh cycle when the peripheral wakes back up.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
